<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consultar cita - GAB-NAILS</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body class="pagina-consultar">

    <!-- ENCABEZADO -->
    <header>

        <img src="imagenes/logo.png"
             alt="Logo de GAB-NAILS">

        <h2>GAB-NAILS</h2>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="cita.html">Agendar cita</a></li>
                <li><a href="consultar-cita.html">Consultar cita</a></li>
                <li><a href="login.html">Administración</a></li>
            </ul>
        </nav>

    </header>


    <!-- CONTENIDO -->
    <main class="contenido-consultar">

        <section class="caja-consultar">

            <h1>Consultar mi cita</h1>

            <p class="texto-consultar">
                Escribe el número de teléfono que utilizaste
                al momento de agendar.
            </p>


            <!-- BÚSQUEDA -->
            <form id="formularioConsulta">

                <label for="telefonoConsulta">
                    Número de teléfono
                </label>

                <input type="tel"
                       id="telefonoConsulta"
                       placeholder="Ejemplo: 4411004275"
                       required>

                <button type="submit">
                    Consultar cita
                </button>

            </form>


            <!-- RESULTADOS -->
            <div id="resultadoCitas"
                 class="resultado-citas">
            </div>

        </section>

    </main>


    <footer>
        <p>© 2026 GAB-NAILS. Todos los derechos reservados.</p>
    </footer>


    <script>

        const formularioConsulta =
            document.getElementById("formularioConsulta");

        const resultadoCitas =
            document.getElementById("resultadoCitas");


        formularioConsulta.addEventListener(
            "submit",
            function(evento) {

                evento.preventDefault();


                const telefono =
                    document.getElementById("telefonoConsulta")
                    .value
                    .trim();


                // OBTENER CITAS GUARDADAS
                const citas =
                    JSON.parse(
                        localStorage.getItem("citasGabNails")
                    ) || [];


                // BUSCAR LAS CITAS DEL TELÉFONO
                const citasEncontradas =
                    citas.filter(function(cita) {

                        return cita.telefono === telefono;

                    });


                // LIMPIAR RESULTADOS
                resultadoCitas.innerHTML = "";


                // SI NO HAY CITAS
                if (citasEncontradas.length === 0) {

                    resultadoCitas.innerHTML = `

                        <div class="cita-no-encontrada">

                            <h3>
                                No encontramos citas
                            </h3>

                            <p>
                                Revisa que el número de teléfono
                                esté escrito correctamente.
                            </p>

                        </div>

                    `;

                    return;

                }


                // MOSTRAR LAS CITAS
                citasEncontradas.forEach(function(cita) {

                    const tarjeta =
                        document.createElement("div");


                    tarjeta.classList.add(
                        "tarjeta-consulta-cita"
                    );


                    let mensajeEstado = "";


                    if (cita.estado === "Pendiente") {

                        mensajeEstado =
                            "Tu cita está esperando confirmación.";

                    }

                    else if (cita.estado === "Confirmada") {

                        mensajeEstado =
                            "Tu cita ha sido confirmada. Te esperamos.";

                    }

                   else if (cita.estado === "Cancelada") {

    mensajeEstado =
        "Tu cita fue cancelada. Puedes agendar una nueva cita.";

}
                    tarjeta.innerHTML = `

                        <h2>
                            ${cita.servicio}
                        </h2>

                        <div class="datos-consulta">

                            <p>
                                <strong>Nombre:</strong>
                                ${cita.nombre}
                            </p>

                            <p>
                                <strong>Fecha:</strong>
                                ${cita.fechaMostrar}
                            </p>

                            <p>
                                <strong>Hora:</strong>
                                ${cita.horaMostrar}
                            </p>

                        </div>


                        <div class="${
                            cita.estado === "Confirmada"
                            ? "estado-consulta-confirmada"
                            : "estado-consulta-pendiente"
                        }">

                            ${cita.estado}

                        </div>


                        <p class="mensaje-estado-cita">
                            ${mensajeEstado}
                        </p>

                    `;


                    resultadoCitas.appendChild(tarjeta);

                });

            }
        );

    </script>

</body>

</html>
