<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administración - GAB-NAILS</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body class="pagina-login">

    <!-- ENCABEZADO -->
    <header>

        <img src="imagenes/logo.png"
             alt="Logo de GAB-NAILS">

        <h2>GAB-NAILS</h2>

      }<nav>
            <ul>

                <li>
                    <a href="index.html">Inicio</a>
                </li>

                <li>
                    <a href="servicios.html">Servicios</a>
                </li>

                <li>
                    <a href="cotizacion.html">
                        Cotizaciones y citas
                    </a>
                </li>

                <li>
                    <a href="contacto.html">Contacto</a>
                </li>

                <li>
                    <a href="login.html">Administración</a>
                </li>

            </ul>
        </nav>

    </header>


    <!-- INICIO DE SESIÓN -->
    <main class="contenido-login">

        <section class="caja-login">

            <img src="imagenes/logo.png"
                 alt="Logo GAB-NAILS"
                 class="logo-login">

            <h1>Administración</h1>

            <p>
                Inicia sesión para administrar GAB-NAILS
            </p>

            <form action="administrador.html">

                <label for="usuario">
                    Usuario
                </label>

                <input type="text"
                       id="usuario"
                       name="usuario"
                       placeholder="Escribe tu usuario"
                       required>


                <label for="contrasena">
                    Contraseña
                </label>

                <input type="password"
                       id="contrasena"
                       name="contrasena"
                       placeholder="Escribe tu contraseña"
                       required>


                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

            <a href="index.html"
               class="volver-inicio">
                Volver al inicio
            </a>

        </section>

    </main>

</body>

</html>
